name: ClaudeCockpit
options:
  bundleIdPrefix: fr.smartcolibri
  deploymentTarget:
    macOS: "14.0"

packages:
  CockpitCore:
    path: CockpitCore

schemes:
  ClaudeCockpit:
    build:
      targets:
        ClaudeCockpit: all
    run:
      config: Debug

targets:
  ClaudeCockpit:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    dependencies:
      - package: CockpitCore
        products: [CockpitShared, UsageKit, RTKKit, SkillsKit, SessionsKit]
    sources:
      - path: ClaudeCockpit
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
          - "Resources/Demo/**"
      # Demo mode sample data (Scripts/make-demo-data.swift), copied as one tree: a plain
      # group would flatten it and collide on its many SKILL.md files.
      - path: ClaudeCockpit/Resources/Demo
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Cockpit for Claude
        # Module name kept stable: the Swift module is not part of the brand.
        PRODUCT_MODULE_NAME: ClaudeCockpit
        PRODUCT_BUNDLE_IDENTIFIER: fr.smartcolibri.cockpitforclaude
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: ClaudeCockpit/Resources/ClaudeCockpit.entitlements
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: ClaudeCockpit/Resources/Info.plist
      properties:
        CFBundleName: Cockpit for Claude
        CFBundleDisplayName: Cockpit for Claude
        CFBundleIdentifier: fr.smartcolibri.cockpitforclaude
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Smart Colibri. All rights reserved."
